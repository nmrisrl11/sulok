<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
		<link rel="shortcut icon" href="/favicon.ico" />

		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="%APP_NAME%" />
		<meta name="theme-color" content="%APP_THEME_COLOR%" />

		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<title data-static-seo="true">%APP_TITLE%</title>

		<!-- SEO Meta Tags -->
		<meta name="author" content="%APP_AUTHOR%" />
		<meta name="keywords" content="%APP_KEYWORDS%" />
		<meta data-static-seo="true" name="description" content="%APP_DESCRIPTION%" />

		<!-- Open Graph / Social -->
		<meta data-static-seo="true" property="og:type" content="website" />
		<meta data-static-seo="true" property="og:title" content="%APP_TITLE%" />
		<meta data-static-seo="true" property="og:description" content="%APP_DESCRIPTION%" />
		<meta data-static-seo="true" property="og:image" content="https://%APP_URL%/og-image.png" />
		<meta data-static-seo="true" property="og:url" content="https://%APP_URL%/" />

		<!-- Twitter -->
		<meta data-static-seo="true" name="twitter:card" content="summary_large_image" />
		<meta data-static-seo="true" name="twitter:title" content="%APP_TITLE%" />
		<meta data-static-seo="true" name="twitter:description" content="%APP_DESCRIPTION%" />
		<meta data-static-seo="true" name="twitter:image" content="https://%APP_URL%/og-image.png" />

		<!-- Prevent FOUC (Theme Flicker) -->
		<script>
			(function () {
				try {
					var theme = localStorage.getItem("sulok-ui-theme") || "system";
					var root = document.documentElement;

					if (theme === "system") {
						var isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
						root.classList.add(isDark ? "dark" : "light");
					} else if (theme === "light" || theme === "dark") {
						root.classList.add(theme);
					} else {
						root.classList.add("theme-" + theme);
						if (theme === "midnight" || theme === "mocha") {
							root.classList.add("dark");
						}
					}
				} catch (e) {}
			})();
		</script>

		<!-- Catch beforeinstallprompt early to prevent missed events -->
		<script>
			window.__deferredPrompt = null;
			window.__isInstallable = false;
			window.addEventListener("beforeinstallprompt", function (e) {
				e.preventDefault();
				window.__deferredPrompt = e;
				window.__isInstallable = true;
				window.dispatchEvent(new Event("app-installable"));
			});
			window.addEventListener("appinstalled", function () {
				window.__deferredPrompt = null;
				window.__isInstallable = false;
				window.dispatchEvent(new Event("app-installable"));
			});
		</script>

		%REACT_SCAN%
	</head>

	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
